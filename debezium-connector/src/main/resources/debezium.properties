# ==================== debezium.properties ====================
# Debezium Engine 基本配置
name=debezium-dameng-connector
connector.class=org.devlive.connector.dameng.DamengConnector

# Offset 存储配置
offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
offset.storage.file.filename=offsets.dat
offset.flush.interval.ms=60000
kafka.topic.name=data-sync-dm-theling-1

# dameng 数据库连接信息
database.hostname=192.168.1.69
database.port=5236
database.user=THELING
database.password=OnPCz12u^@~*ecfmZvR
database.dbname=THELING
database.server.name=dameng-server

# Schema 和表过滤
schema.include.list=THELING
table.include.list=THELING.BUSI_SCOPE_ITEMS_LABEL

# 快照模式配置
# initial: 首次启动时对表进行快照
# schema_only: 只捕获 schema，不捕获数据
# never: 不进行快照，只捕获变更
snapshot.mode=schema_only

# Oracle LogMiner 配置
log.mining.strategy=online_catalog
log.mining.continuous.mine=true
log.mining.batch.size.default=1000
log.mining.batch.size.min=1000
log.mining.batch.size.max=10000

database.history.kafka.bootstrap.servers=192.168.1.95:9092
database.history.kafka.topic=debezium-history

# 时间配置
decimal.handling.mode=string
time.precision.mode=adaptive